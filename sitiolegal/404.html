<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · MiTecho</title>
<link rel="icon" href="../assets/Logoglyph.png">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0A;--cd:#16180F;--ln:rgba(255,255,255,.08);--ik:#F2F4EC;--mu:#A3A898;--ac:#D4FF3A;--oa:#0B0C0A;--at:#D4FF3A}
body{margin:0;background:var(--bg);color:var(--ik);font:400 16px/1.6 'Hanken Grotesk',sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box;text-align:center}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:24px;padding:36px 28px;max-width:480px;width:100%}
img{width:64px;height:auto;margin-bottom:12px}
h1{font:700 28px 'Familjen Grotesk',sans-serif;margin:0 0 10px;color:var(--ik)}
p{color:var(--mu);margin:0 0 24px;font-size:15px}
.btn{display:inline-block;background:var(--ac);color:var(--oa);font:700 15px 'Familjen Grotesk',sans-serif;text-decoration:none;border-radius:999px;padding:12px 24px}
</style>
<script>
setTimeout(function(){ window.location.href = '/'; }, 2500);
</script>
</head>
<body>
<div class="card">
  <img src="../assets/Logoglyph.png" alt="MiTecho">
  <h1>Página no encontrada</h1>
  <p>La dirección solicitada no existe o fue movida. Te estamos redirigiendo al portal oficial de MiTecho...</p>

</body>
